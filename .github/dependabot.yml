version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "narlasuman"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps:"
      prefix-development: "deps(dev):"
      include: "scope"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "narlasuman"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps:"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    reviewers:
      - "narlasuman"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci:"
      include: "scope"
